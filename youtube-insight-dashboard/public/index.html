<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080809" />
    <meta name="description" content="CogniraAI — Turn any content into clarity. AI-powered transcript intelligence for YouTube, audio, video, and documents." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CogniraAI" />

    <!-- OG / Social -->
    <meta property="og:title" content="CogniraAI — Content Intelligence" />
    <meta property="og:description" content="Turn any video, audio or document into instant answers, chapters, quizzes and notes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CogniraAI" />
    <meta name="twitter:description" content="AI-powered transcript intelligence." />

    <title>CogniraAI</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      /* ── Critical above-the-fold styles injected here so there's zero FOUC ── */
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html { background: #080809; }
      body {
        background: #080809;
        color: #eeebe5;
        min-height: 100vh;
        min-height: 100dvh;
        overflow-x: hidden;
      }

      /* ── App loading screen ─────────────────────────────────────────────── */
      #app-loader {
        position: fixed;
        inset: 0;
        background: #080809;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 9999;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #app-loader.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-logo {
        font-size: 26px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #eeebe5;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .loader-dot {
        width: 10px; height: 10px;
        background: #1bbb9e;
        border-radius: 50%;
        box-shadow: 0 0 16px #1bbb9e;
        animation: loaderPulse 1.4s ease-in-out infinite;
      }
      .loader-bar {
        width: 180px;
        height: 2px;
        background: rgba(255,255,255,0.08);
        border-radius: 1px;
        overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #1bbb9e, #e8a838);
        border-radius: 1px;
        animation: loaderSweep 1.2s ease-in-out infinite;
        transform-origin: left;
      }
      @keyframes loaderPulse {
        0%, 100% { transform: scale(1);    opacity: 1; }
        50%       { transform: scale(1.35); opacity: 0.7; }
      }
      @keyframes loaderSweep {
        0%   { transform: scaleX(0);   opacity: 0; }
        20%  { opacity: 1; }
        100% { transform: scaleX(1);   opacity: 0.6; }
      }

      /* ── Static grain overlay (CSS only, no image) ──────────────────────── */
      #grain-overlay {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        opacity: 0.028;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px;
      }
      #grain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.03;
  z-index: 1;
}
    </style>
  </head>
  
  <body>
    <noscript>
      <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#8a8780;font-size:14px;">
        You need to enable JavaScript to run Cognira.
      </div>
    </noscript>
<canvas id="grain"></canvas>
    <!-- Loading screen — hidden once React mounts -->
    <div id="app-loader">
      <div class="loader-logo">
        <div class="loader-dot"></div>
        CogniraAI
      </div>
      <div class="loader-bar">
        <div class="loader-bar-fill"></div>
      </div>
    </div>

    <!-- Film grain overlay -->
    <div id="grain-overlay" aria-hidden="true"></div>

    <!-- React root -->
    <div id="root"></div>

    <script>
      // Hide loader once React has painted
      window.__hideLoader = function() {
        var el = document.getElementById('app-loader');
        if (el) el.classList.add('hidden');
      };
      window.addEventListener("load", () => {
  const grain = document.getElementById("grain");
  if (!grain) return;

  const ctx = grain.getContext("2d");

  function resize() {
    grain.width = window.innerWidth;
    grain.height = window.innerHeight;
  }
  resize();
  window.onresize = resize;

  function noise() {
    const w = grain.width;
    const h = grain.height;
    const imageData = ctx.createImageData(w, h);
    const buffer = new Uint32Array(imageData.data.buffer);

    for (let i = 0; i < buffer.length; i++) {
      buffer[i] = (Math.random() * 255) | 0;
    }

    ctx.putImageData(imageData, 0, 0);
    requestAnimationFrame(noise);
  }
  noise();
});
    </script>
  </body>
</html>
