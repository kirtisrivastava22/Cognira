<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube RAG</title>
  </head>
  <body>
    <div class="header">
      <div class="header-content">
        <div class="icon">
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"
            />
          </svg>
        </div>
        <div>
          <h1>YouTube RAG</h1>
          <p>Your video buddy...</p>
        </div>
      </div>
    </div>

    <div class="container">
      <!-- Add this after the question input section -->
      <div class="tabs">
        <button class="tab-btn active" data-tab="ask">Ask Question</button>
        <button class="tab-btn" data-tab="chapters">Chapters</button>
        <button class="tab-btn" data-tab="quiz">Quiz</button>
      </div>

      <div id="ask-tab" class="tab-content active">
        <div class="input-group">
          <label for="question">Your Question</label>
          <textarea
            id="question"
            rows="3"
            placeholder="What is this video about?"
          ></textarea>
        </div>

        <button id="ask">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"
            />
          </svg>
          Ask Question
        </button>

        <div id="status-container"></div>
        <div id="answer-container"></div>
      </div>

      <div id="chapters-tab" class="tab-content hidden">
        <button id="load-chapters-btn" class="primary-btn">
          Load Chapters
        </button>
        <div id="chapters-list"></div>
      </div>

      <div id="quiz-tab" class="tab-content hidden">
        <button id="generate-quiz-btn" class="primary-btn">
          Generate Quiz (5 Questions)
        </button>
        <div id="quiz-container"></div>
        <div id="quiz-results" class="hidden"></div>
      </div>
      

      <div id="tips" class="tips-box">
        <h3>💡 Tips:</h3>
        <ul>
          <li>• Ask specific questions about the video content</li>
          <li>• Click timestamps to jump to relevant moments</li>
          <li>• Works best with videos that have captions</li>
        </ul>
      </div>
    </div>

    <div class="footer">Powered by RAG • FastAPI • LangChain</div>

    <script src="popup.js"></script>
  </body>
</html>
