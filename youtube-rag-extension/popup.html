<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="popup.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Insight Assistant</title>
  </head>
  <body>
    <div class="header">
      <div
        class="header-content"
        style="display: flex; align-items: center; gap: 15px"
      >
        <div class="icon"> 
          <img
            src="youtube2.png"
            alt="YouTube RAG Icon"
            width="50"
            height="50"
          />
        </div>
        <div>
          <h2>YouTube Insight Assistant</h2>
          <p>Ask, learn, jump to answers</p>
        </div>
        <h1 id="video-title"></h1>
      </div>
    </div>

    <div class="container">
      <div class="tabs">
        <button class="tab-btn active" data-tab="ask">Ask Question</button>
        <button class="tab-btn" data-tab="chapters">Chapters</button>
        <button class="tab-btn" data-tab="quiz">Quiz</button>
      </div>

      <div id="ask-tab" class="tab-content active">
        <div class="input-group">
          <label for="question">Your Question</label>
          <textarea
            id="question"
            rows="3"
            placeholder="What is this video about?"
          ></textarea>
        </div>

        <button id="ask">Ask Question</button>

        <div id="status-container"></div>
        <div id="answer-container"></div>

        <button id="export-pdf-btn" class="primary-btn">
          📄 Export Notes as PDF
        </button>
      </div>

      <div id="chapters-tab" class="tab-content hidden">
        <button id="load-chapters-btn" class="primary-btn">
          Load Chapters
        </button>
        <div id="chapters-list"></div>
      </div>

      <div id="quiz-tab" class="tab-content hidden">
        <div class="quiz-config">
          <label for="quiz-question-count">Number of Questions:</label>
          <select id="quiz-question-count" class="input">
            <option value="3">3 Questions</option>
            <option value="5" selected>5 Questions</option>
            <option value="7">7 Questions</option>
            <option value="10">10 Questions</option>
          </select>
        </div>
        
        <button id="generate-quiz-btn" class="primary-btn">
          Generate Quiz
        </button>
        
        <div id="quiz-container"></div>
        <div id="quiz-results" class="hidden"></div>
      </div>

      <div id="tips" class="tips-box">
        <h3>💡 Tips:</h3>
        <ul>
          <li>Ask specific questions about the video content</li>
          <li>Click timestamps in answers to jump to moments</li>
          <li>Works best with videos that have captions</li>
        </ul>
      </div>
    </div>

    <div class="footer">Powered by RAG • FastAPI • LangChain</div>

    <script src="popup.js"></script>
  </body>
</html>
